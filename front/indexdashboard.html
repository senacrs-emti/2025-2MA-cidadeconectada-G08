<script>
  const ctx = document.getElementById('UPAschart');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['UPA Cruzeiro', 'UPA Moacyr Scliar', 'UPA Lomba do Pinheiro'],
      datasets: [{
        label: 'Número de Vagas [UPAS]',
        data: [12, 19, 3, 5, 2, 3],
        borderWidth: 1
      }]
    },
    options: {
    animation: {
        duration: 900,
        easing: "easeOutQuad"
    },
    responsive: true,
    plugins: {
        legend: { position: "bottom" }
    }
}
  });

</script>


<script>
    const pieCtx = document.getElementById("pieChart").getContext("2d");
        new Chart(pieCtx, {
        type: "pie",
        data: {
            labels: ["UPA", "UBS", "CAPS"],
            datasets: [{
              data: [12, 19, 3],
                backgroundColor: [
                    "rgba(255, 99, 132, 0.7)",   // vermelho
                    "rgba(54, 162, 235, 0.7)",   // azul claro
                    "rgba(255, 206, 86, 0.7)"    // amarelo
                ],
                borderColor: [
                    "rgba(255, 99, 132, 1)",
                    "rgba(54, 162, 235, 1)",
                    "rgba(255, 206, 86, 1)"
                ],
                borderWidth: 2
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
                duration: 1000,
                easing: "easeOutBounce"
            },

            plugins: {
                legend: {
                    position: "bottom",
                    labels: {
                        font: { size: 14 }
                    }
                },

                tooltip: {
                    callbacks: {
                        label: function (pieCtx) {
                            let label = ctx.label || "";
                            let val = ctx.raw || 0;
                            let total = cont.upas + cont.ubs + cont.caps;
                            let pct = ((val / total) * 100).toFixed(1);
                            return `${label}: ${val} (${pct}%)`;
                        }
                    }
                }
            }
        }
    });


</script>
